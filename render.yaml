services:
  - type: web
    name: snow-leopards-aiops-cloud
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r saas_service/requirements.txt
    startCommand: uvicorn saas_service.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: AIOPS_SSL_ENABLED
        value: "0"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FIREBASE_CONFIG_PATH
        sync: false
