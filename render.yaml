services:
  - type: web
    name: snow-leopards-aiops-cloud
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r saas_service/requirements.txt
    startCommand: uvicorn saas_service.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: AIOPS_SSL_ENABLED
        value: "0"
      - key: JWT_SECRET_KEY
        generateValue: true
