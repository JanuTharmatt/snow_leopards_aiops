<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — SNOW LEOPARDS Autonomous AIOps</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 10% 20%, rgba(127, 95, 227, 0.12) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.10) 0%, transparent 40%),
                  linear-gradient(135deg, #f8f9fe 0%, #edf0fa 50%, #e7ecf8 100%);
      min-height: 100vh;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .card-pop {
      background: #ffffff;
      border: 1px solid rgba(220, 225, 245, 0.9);
      box-shadow: 0 20px 40px -15px rgba(107, 85, 163, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-pop {
      background: linear-gradient(135deg, #7f5fe3 0%, #6366f1 100%);
      box-shadow: 0 10px 20px -5px rgba(127, 95, 227, 0.38);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-pop:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 28px -6px rgba(127, 95, 227, 0.52);
    }
    .input-pop {
      transition: all 0.2s ease;
      border: 1.5px solid #e2e8f8;
      background: #fbfbfe;
    }
    .input-pop:focus {
      outline: none;
      border-color: #7f5fe3;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(127, 95, 227, 0.12);
      transform: translateY(-1px);
    }
  </style>
</head>
<body class="flex items-center justify-center p-6 text-slate-800">

  <div class="w-full max-w-md">
    
    <!-- Official Logo -->
    <div class="text-center mb-6">
      <div class="inline-block p-2 bg-white rounded-3xl shadow-xl shadow-indigo-500/10 border border-slate-100 transform hover:scale-105 transition-transform duration-300">
        <img src="/static/images/snow_leopard_logo.jpg" alt="SNOW LEOPARDS" class="h-28 w-auto mx-auto object-contain rounded-2xl">
      </div>
    </div>

    <!-- Main Card -->
    <div class="card-pop rounded-3xl p-8">
      
      <div class="pb-5 mb-5 border-b border-slate-100">
        <h2 class="text-base font-bold text-slate-900">Reset Your Password</h2>
        <p class="text-xs text-slate-500">Enter your registered email to receive recovery instructions</p>
      </div>

      <div id="resetStatus" class="hidden text-xs p-3 rounded-xl border font-semibold mb-4 text-center"></div>

      <form id="forgotForm" onsubmit="handleReset(event)" class="space-y-4">
        
        <!-- User Email -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wider">Account Email Address</label>
          <input type="email" id="resetEmail" required
                 class="input-pop w-full text-xs font-medium text-slate-800 rounded-xl px-3.5 py-3 focus:outline-none mono"
                 placeholder="name@domain.com">
        </div>

        <!-- Primary Submit Button -->
        <div class="pt-2">
          <button type="submit" id="submitBtn" class="btn-pop w-full text-white font-bold text-xs uppercase tracking-wider py-3.5 rounded-xl flex items-center justify-center gap-2">
            <span>Send Recovery Link</span>
            <span>→</span>
          </button>
        </div>

      </form>

      <!-- Back to login -->
      <div class="mt-6 pt-5 border-t border-slate-100 text-center">
        <a href="/login" class="text-xs text-indigo-600 font-bold hover:underline">← Back to Console Login</a>
      </div>

    </div>

  </div>

  <script>
    async function handleReset(e) {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value.trim();
      const statusEl = document.getElementById('resetStatus');
      const btn = document.getElementById('submitBtn');

      statusEl.classList.add('hidden');
      btn.disabled = true;
      btn.innerText = "Dispatching...";

      try {
        const resp = await fetch('/api/v1/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });

        const data = await resp.json();
        statusEl.className = "text-xs p-3 rounded-xl border font-semibold mb-4 text-center bg-emerald-50 text-emerald-700 border-emerald-200";
        statusEl.textContent = data.message || "Password recovery dispatched successfully!";
        statusEl.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = `<span>Dispatched Successfully</span>`;
      } catch (err) {
        statusEl.className = "text-xs p-3 rounded-xl border font-semibold mb-4 text-center bg-rose-50 text-rose-600 border-rose-200";
        statusEl.textContent = "Could not send reset instructions. Please verify email.";
        statusEl.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = `<span>Send Recovery Link</span><span>→</span>`;
      }
    }
  </script>
</body>
</html>
